<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | UniVersus</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <p class="logo"><a href="index.html">UniVersus</a></p>
        <nav class="nav-links" aria-label="Cuenta">
          <a href="login.html">Iniciar sesión</a>
          <a href="register.html">Registrarse</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="auth-card">
        <h1>Crear cuenta</h1>
        <p class="subtitulo">Regístrate para participar en los torneos de UniVersus.</p>

        <p id="mensaje-error" class="mensaje-error" role="alert"></p>
        <p id="mensaje-ok" class="mensaje-ok" role="status"></p>

        <form id="form-registro" novalidate>
          <div class="form-grupo">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" autocomplete="name" required />
          </div>
          <div class="form-grupo">
            <label for="programa">Programa</label>
            <input id="programa" name="programa" type="text" required />
          </div>
          <div class="form-grupo">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="form-grupo">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required />
          </div>
          <button class="btn" type="submit">Registrarme</button>
        </form>

        <p class="auth-footer">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
      </section>
    </main>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
