<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | UniVersus</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <p class="logo"><a href="index.html">UniVersus</a></p>
        <nav class="nav-links" aria-label="Cuenta">
          <a href="login.html">Iniciar sesión</a>
          <a href="register.html">Registrarse</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="auth-card">
        <h1>Crear cuenta</h1>
        <p class="subtitulo">Regístrate para participar en los torneos de UniVersus.</p>

        <p id="mensaje-error" class="mensaje-error" role="alert"></p>
        <p id="mensaje-ok" class="mensaje-ok" role="status"></p>

        <form id="form-registro" novalidate>
          <div class="form-grupo">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" autocomplete="name" required />
          </div>
          <div class="form-grupo">
            <label for="programa">Programa académico y jornada</label>
            <select
              id="programa"
              name="programa"
              autocomplete="organization-title"
              aria-describedby="error-programa"
              aria-invalid="false"
              required
            >
              <option value="" disabled selected>Selecciona tu programa y jornada</option>
              <optgroup label="Tecnologías">
                <option value="2724-Diurno">2724: Tecnología en Desarrollo de Software (Diurno)</option>
                <option value="2724-Nocturno">2724: Tecnología en Desarrollo de Software (Nocturno)</option>
                <option value="2711-Diurno">2711: Tecnología en Sistemas de Información (Diurno)</option>
                <option value="2711-Nocturno">2711: Tecnología en Sistemas de Información (Nocturno)</option>
                <option value="2838-Diurno">2838: Tecnología en Gestión del Talento Humano (Diurno)</option>
                <option value="2838-Nocturno">2838: Tecnología en Gestión del Talento Humano (Nocturno)</option>
                <option value="2837-Diurno">2837: Tecnología en Gestión de la Calidad (Diurno)</option>
                <option value="2837-Nocturno">2837: Tecnología en Gestión de la Calidad (Nocturno)</option>
                <option value="2839-Diurno">2839: Tecnología en Gestión Logística (Diurno)</option>
                <option value="2839-Nocturno">2839: Tecnología en Gestión Logística (Nocturno)</option>
              </optgroup>
              <optgroup label="Carreras Profesionales y Licenciaturas">
                <option value="3845-Diurno">3845: Administración de Empresas (Diurno)</option>
                <option value="3845-Nocturno">3845: Administración de Empresas (Nocturno)</option>
                <option value="3841-Diurno">3841: Contaduría Pública (Diurno)</option>
                <option value="3841-Nocturno">3841: Contaduría Pública (Nocturno)</option>
                <option value="3249-Diurno">3249: Trabajo Social (Diurno)</option>
                <option value="3249-Nocturno">3249: Trabajo Social (Nocturno)</option>
                <option value="3489-Diurno">3489: Estudios Políticos y Resolución de Conflictos (Diurno)</option>
                <option value="3489-Nocturno">3489: Estudios Políticos y Resolución de Conflictos (Nocturno)</option>
                <option value="3150-Diurno">3150: Profesional en Agroindustria (Diurno)</option>
                <option value="3150-Nocturno">3150: Profesional en Agroindustria (Nocturno)</option>
                <option value="3469-Diurno">3469: Licenciatura en Educación Básica con Énfasis en Matemáticas (Diurno)</option>
                <option value="3469-Nocturno">3469: Licenciatura en Educación Básica con Énfasis en Matemáticas (Nocturno)</option>
              </optgroup>
            </select>
            <p id="error-programa" class="mensaje-error" role="alert" aria-live="polite" hidden>
              Elige tu programa y jornada para continuar.
            </p>
          </div>
          <div class="form-grupo">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="form-grupo">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required />
          </div>
          <button class="btn" type="submit">Registrarme</button>
        </form>

        <p class="auth-footer">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
      </section>
    </main>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
