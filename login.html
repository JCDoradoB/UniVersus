<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | UniVersus</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <p class="logo"><a href="index.html">UniVersus</a></p>
        <nav class="nav-links" aria-label="Cuenta">
          <a href="login.html">Iniciar sesión</a>
          <a href="register.html">Registrarse</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="auth-card">
        <h1>Iniciar sesión</h1>
        <p class="subtitulo">Entra con tu correo institucional para inscribirte a torneos.</p>

        <p id="mensaje-error" class="mensaje-error" role="alert"></p>

        <form id="form-login" novalidate>
          <div class="form-grupo">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="form-grupo">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button class="btn" type="submit">Entrar</button>
        </form>

        <p class="auth-footer">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
      </section>
    </main>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
